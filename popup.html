<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 210px;
      margin: 0;
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #333333;
    }
    .menu-button {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 6px;
      border: none;
      border-radius: 6px;
      background-color: #f1f3f4;
      color: #202124;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-sizing: border-box;
      transition: background-color 0.15s ease;
    }
    .menu-button:last-of-type {
      margin-bottom: 10px;
    }
    .menu-button:hover {
      background-color: #e3e5e8;
    }
    .menu-button.playlist {
      background-color: #2e7d32;
      color: #ffffff;
    }
    .menu-button.playlist:hover {
      background-color: #1b5e20;
    }
    .menu-button.primary {
      background-color: #c62828;
      color: #ffffff;
    }
    .menu-button.primary:hover {
      background-color: #b71c1c;
    }
    .hidden {
      display: none;
    }
    .icon {
      margin-right: 8px;
      font-size: 15px;
    }
    .footer-link {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #666;
      text-decoration: none;
      padding-top: 4px;
      border-top: 1px solid #eee;
    }
    .footer-link:hover {
      color: #c62828;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <button class="menu-button" id="btnMp4">
    <span class="icon">🎬</span> als MP4 speichern
  </button>
  <button class="menu-button" id="btnMp3">
    <span class="icon">🎵</span> als MP3 speichern
  </button>
  <button class="menu-button playlist hidden" id="btnPlaylist">
    <span class="icon">📋</span> Playlist an MeTube senden
  </button>
  <button class="menu-button primary" id="btnOpenMetube">
    <span class="icon">🌐</span> MeTube aufrufen
  </button>
  
  <a href="#" id="openOptions" class="footer-link">⚙️ Einstellungen öffnen</a>

  <script src="popup.js"></script>
</body>
</html>
