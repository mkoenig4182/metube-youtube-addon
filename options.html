<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Send to MeTube - Einstellungen</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    h2 { color: #c62828; }
    h3 { font-size: 15px; margin-top: 25px; border-top: 1px solid #ddd; padding-top: 15px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input[type="url"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      background-color: #c62828;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background-color: #b71c1c; }
    .secondary-btn { background-color: #555; margin-left: 10px; }
    .secondary-btn:hover { background-color: #444; }
    #status { margin-top: 15px; font-weight: bold; color: #2e7d32; }
    .perm-box { background: #fff; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <h2>MeTube Erweiterung - Einstellungen</h2>
  <div class="form-group">
    <label for="metubeUrl">MeTube Instanz URL:</label>
    <input type="url" id="metubeUrl" placeholder="https://deine.metube.url">
    <small style="color: #666; display: block; margin-top: 5px;">Basis-URL deiner MeTube-Instanz (ohne /add am Ende).</small>
  </div>
  
  <div>
    <button id="save">Speichern</button>
  </div>

  <h3>Berechtigungen & Zugriff</h3>
  <div class="form-group">
    <div class="perm-box" id="permStatus">Prüfe Berechtigungsstatus...</div>
    <button id="requestPerm" class="secondary-btn" style="margin-top: 10px; margin-left: 0;">Berechtigung für Instanz anfordern</button>
  </div>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
